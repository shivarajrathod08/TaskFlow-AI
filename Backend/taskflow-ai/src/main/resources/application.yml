spring:
  application:
    name: taskflow-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_ai
    username: postgres
    password: your_actual_postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true